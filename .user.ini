; =========================================================
; MD Molas e Artefatos de Aço
; Usado quando a hospedagem roda PHP via PHP-FPM (a maioria
; dos cPanel modernos com CloudLinux/"MultiPHP"). Se a sua
; hospedagem usa mod_php, o .htaccess incluído já resolve.
;
; Obs.: mudanças aqui podem levar alguns minutos para valer
; (o PHP-FPM só relê este arquivo periodicamente).
; =========================================================
upload_max_filesize = 20M
post_max_size = 21M
max_execution_time = 120
max_input_time = 120
memory_limit = 128M
